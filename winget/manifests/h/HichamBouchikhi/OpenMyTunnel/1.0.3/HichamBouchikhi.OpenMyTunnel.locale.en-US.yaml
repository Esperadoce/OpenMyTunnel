ShortDescription: Lightweight SSH SOCKS5 tunnel manager with system tray support
Description: |-
  A lightweight SSH SOCKS5 tunnel manager. Configure your server once, click Connect,
  and the tunnel runs quietly in the system tray. Equivalent to running
  ssh -D 1080 -N user@host -p 22. Supports password and SSH key authentication
  (including key + passphrase), colour-coded tray icon, and start-minimised mode.
  AOT-compiled — no .NET runtime required.
